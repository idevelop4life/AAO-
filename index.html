<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Angela Agunwami Onwuka</title>
<meta name="description" content="Angela Agunwami Onwuka: Nigerian-American founder, technologist and content creator based in Atlanta.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..800;1,6..96,400..700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: one long editorial scroll on black, gold used as hairlines and accents, a single framed hero. */
:root{
  --ink:#0b0a08;
  --panel:#141210;
  --line:#2c271d;
  --gold:#d4af5a;
  --gold-soft:#a88b4a;
  --text:#f2ece0;
  --muted:#a59d8e;
  --danger:#e07a6a;
  --display:"Bodoni Moda", "Didot", "Bodoni 72", Georgia, serif;
  --body:"Manrope", "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}*{transition:none!important}}
body{margin:0;background:var(--ink);color:var(--text);font-family:var(--body);font-size:17px;line-height:1.65;-webkit-font-smoothing:antialiased}
a{color:var(--gold);text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:2px}
h1,h2,h3{font-family:var(--display);font-weight:500;line-height:1.1;text-wrap:balance;margin:0}
.wrap{max-width:1120px;margin:0 auto;padding:0 clamp(16px,4vw,40px)}
[hidden]{display:none!important}

/* nav */
header.top{position:sticky;top:0;z-index:10;background:rgba(11,10,8,.88);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:24px;height:64px}
.mark{font-family:var(--display);font-size:22px;letter-spacing:.08em;color:var(--gold)}
.mark:hover{text-decoration:none}
nav ul{display:flex;gap:clamp(14px,2.4vw,28px);list-style:none;margin:0;padding:0;font-size:13px;letter-spacing:.14em;text-transform:uppercase}
nav a{color:var(--muted)}
nav a:hover{color:var(--gold);text-decoration:none}
@media (max-width:560px){nav ul li.opt{display:none}}

/* hero */
.hero{padding:clamp(56px,9vw,112px) 0 clamp(48px,7vw,88px)}
.hero .wrap{display:grid;grid-template-columns:1.35fr 1fr;gap:clamp(32px,6vw,80px);align-items:center}
.kicker{font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-soft);margin:0 0 20px}
.hero h1{font-size:clamp(44px,7.2vw,92px);font-weight:500;letter-spacing:-.01em}
.hero h1 em{font-style:italic;color:var(--gold)}
.hero p.lede{font-size:clamp(18px,1.6vw,21px);color:var(--muted);max-width:34ch;margin:28px 0 32px}
.socials{display:flex;flex-wrap:wrap;gap:10px;padding:0;margin:0;list-style:none}
.socials a{display:inline-flex;align-items:center;gap:9px;border:1px solid var(--line);padding:9px 15px;border-radius:999px;font-size:14px;color:var(--text);transition:border-color .2s,color .2s}
.socials a:hover{border-color:var(--gold);color:var(--gold);text-decoration:none}
.socials svg{width:16px;height:16px;fill:currentColor;flex:none}
.socials .h{color:var(--muted)}
.socials a:hover .h{color:inherit}
.portrait{position:relative;aspect-ratio:4/5;border:1px solid var(--gold-soft);padding:14px;margin:0;background:var(--ink)}
.portrait img{display:block;width:100%;height:100%;object-fit:cover}
.portrait::after{content:"";position:absolute;inset:-10px 10px 10px -10px;border:1px solid var(--line);z-index:-1}
@media (max-width:820px){.hero .wrap{grid-template-columns:1fr}.portrait{max-width:360px}}

/* sections */
section.block{padding:clamp(64px,9vw,112px) 0;border-top:1px solid var(--line)}
.sec-head{display:grid;grid-template-columns:200px 1fr;gap:32px;margin-bottom:48px;align-items:baseline}
.sec-head .label{font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.sec-head h2{font-size:clamp(32px,4.4vw,52px)}
@media (max-width:760px){.sec-head{grid-template-columns:1fr;gap:10px}}
.indent{margin-left:232px}
@media (max-width:760px){.indent{margin-left:0}}

/* about */
.about{display:grid;grid-template-columns:minmax(220px,.8fr) 1.4fr;gap:clamp(32px,6vw,80px);align-items:start}
.about.solo{grid-template-columns:1fr}
.about p{margin:0 0 1.1em;max-width:62ch}
.about p.big{font-family:var(--display);font-size:clamp(22px,2.2vw,28px);line-height:1.4}
.cutout{margin:0;position:relative;display:flex;justify-content:center;align-items:flex-end;border-bottom:1px solid var(--gold-soft)}
.cutout::before{content:"";position:absolute;left:8%;right:8%;top:14%;bottom:0;background:radial-gradient(closest-side,rgba(212,175,90,.28),rgba(212,175,90,0));z-index:0}
.cutout img{position:relative;z-index:1;width:100%;max-width:360px;height:auto;display:block}
.facts{border-top:1px solid var(--line);padding-top:28px;margin:32px 0 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:22px 32px}
.facts dt{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold-soft)}
.facts dd{margin:4px 0 0;font-size:16px}
@media (max-width:820px){.about{grid-template-columns:1fr}.cutout img{max-width:280px}}

/* building */
.ventures{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line)}
.venture{background:var(--ink);padding:30px 28px 32px;display:flex;flex-direction:column;gap:10px}
.venture .st{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-soft)}
.venture h3{font-size:26px}
.venture p{margin:0;color:var(--muted);font-size:15.5px}
.venture a{font-size:14px;margin-top:auto;padding-top:8px;overflow-wrap:anywhere}
.venture.lead{grid-column:1/-1;display:grid;grid-template-columns:1fr 1.4fr;gap:40px;padding:40px}
.venture.lead h3{font-size:clamp(30px,3.4vw,40px)}
@media (max-width:900px){.ventures{grid-template-columns:1fr 1fr}.venture.lead{grid-template-columns:1fr;gap:12px}}
@media (max-width:560px){.ventures{grid-template-columns:1fr}.venture.lead{padding:30px 28px}}

.hero h1 em,.venture h3 em{font-style:italic;color:var(--gold)}
.cta-row{display:flex;flex-wrap:wrap;align-items:center;gap:18px;margin-top:22px}
.cta-row a{margin:0;padding:0}
.cta-row a.btn{padding:13px 20px}
a.btn:hover{text-decoration:none}

/* gallery */
.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;align-items:start}
.gallery figure{margin:0}
.gallery .ph img{aspect-ratio:4/5;object-fit:cover;object-position:50% 25%}
.gallery .ph{display:block;width:100%;border:0;padding:0;background:none;cursor:zoom-in}
.gallery img{display:block;width:100%;height:auto;border:1px solid var(--line);transition:border-color .2s}
.gallery .ph:hover img{border-color:var(--gold)}
.gallery figcaption{font-size:14px;color:var(--muted);margin-top:8px}
.reader article.wide{max-width:1000px}
.lb{margin:0}.lb img{display:block;max-width:100%;max-height:82vh;margin:0 auto}
.lb figcaption{text-align:center;color:var(--muted);margin-top:14px}

/* thoughts */
.feed{max-width:680px}
.thought{border-top:1px solid var(--line);padding:24px 0}
.thought:last-of-type{border-bottom:1px solid var(--line)}
.thought header{display:flex;align-items:center;gap:12px}
.thought header p{margin:0;font-size:15px}
.av{width:42px;height:42px;border-radius:50%;object-fit:cover;object-position:50% 20%;border:1px solid var(--gold-soft);flex:none}
.mut{color:var(--muted)}
.thought .tx{font-size:19px;line-height:1.55;margin:14px 0 12px}
.acts{display:flex;flex-wrap:wrap;gap:20px;align-items:center;font-size:14px}
.lnk{background:none;border:0;padding:0;color:var(--gold);font:inherit;font-size:14px;cursor:pointer}
.lnk:hover{text-decoration:underline;text-underline-offset:3px}
.lnk.del{color:var(--muted);font-size:13px;margin-left:8px}
.lnk.del:hover{color:var(--danger)}
.replies{list-style:none;margin:14px 0 0 54px;padding:0 0 0 18px;border-left:1px solid var(--gold-soft);display:grid;gap:14px}
.replies:empty{display:none}
.replies p{margin:0;font-size:15.5px}
.replies .who{font-size:14px;margin-bottom:2px}
.reply-form{margin:14px 0 0 54px;display:grid;gap:10px}
.reply-form textarea{background:var(--ink);border:1px solid var(--line);color:var(--text);padding:12px;font:inherit;font-size:15px;min-height:80px;resize:vertical;border-radius:2px}
.reply-form textarea:focus{border-color:var(--gold);outline:none}
.reply-form .row{display:flex;align-items:center;gap:14px}
.btn.sm{padding:9px 16px;font-size:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:560px){.replies,.reply-form{margin-left:0}}

/* interests */
.interests{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:32px}
.interest h3{font-family:var(--body);font-size:17px;font-weight:600;margin-bottom:8px}
.interest h3::before{content:"";display:block;width:28px;height:1px;background:var(--gold);margin-bottom:16px}
.interest p{margin:0;color:var(--muted);font-size:15.5px}

/* quote */
.quote{padding:clamp(64px,9vw,112px) 0;border-top:1px solid var(--line);background:linear-gradient(180deg,var(--panel),var(--ink))}
.quote blockquote{margin:0;font-family:var(--display);font-style:italic;font-size:clamp(28px,4vw,48px);line-height:1.25;max-width:24ch}
.quote blockquote::before{content:"\201C";display:block;color:var(--gold);font-size:1.6em;line-height:.6;margin-bottom:12px;font-style:normal}
.quote .by{margin-top:24px;color:var(--gold-soft);font-size:14px;letter-spacing:.14em;text-transform:uppercase}

/* journal */
.posts{display:grid;grid-template-columns:repeat(3,1fr);gap:36px}
.post{display:flex;flex-direction:column;gap:12px;padding-top:22px;border-top:1px solid var(--gold-soft)}
.post .meta{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.post h3{font-size:25px;line-height:1.2}
.post p{margin:0;color:var(--muted);font-size:15.5px}
.post button.read{align-self:flex-start;background:none;border:0;padding:0;color:var(--gold);font:inherit;font-size:14px;cursor:pointer}
.post button.read:hover{text-decoration:underline;text-underline-offset:3px}
@media (max-width:900px){.posts{grid-template-columns:1fr}}

/* reader */
.reader{position:fixed;inset:0;z-index:40;background:rgba(5,5,4,.92);overflow-y:auto;padding:clamp(24px,6vw,72px) 16px}
.reader article{max-width:680px;margin:0 auto}
.reader .meta{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-soft)}
.reader h2{font-size:clamp(34px,5vw,54px);margin:14px 0 32px}
.reader p{font-size:18px;line-height:1.75;margin:0 0 1.2em}
.reader .close{position:fixed;top:18px;right:18px}

/* subscribe */
.sub{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:start}
.sub .intro p{color:var(--muted);max-width:46ch;margin:18px 0 0}
form.signup{background:var(--panel);border:1px solid var(--line);padding:32px;display:grid;gap:18px}
form.signup label.field{display:grid;gap:8px;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
form.signup input[type=text],form.signup input[type=email]{background:var(--ink);border:1px solid var(--line);color:var(--text);padding:13px 14px;font:inherit;font-size:16px;letter-spacing:0;text-transform:none;border-radius:2px}
form.signup input:focus{border-color:var(--gold);outline:none}
form.signup fieldset{border:0;padding:0;margin:0;display:grid;gap:10px}
form.signup legend{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.freq{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.freq label{display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);padding:14px;cursor:pointer;border-radius:2px;transition:border-color .2s}
.freq label strong{font-weight:600;color:var(--text)}
.freq label span{font-size:13.5px;color:var(--muted)}
.freq input{position:absolute;opacity:0;pointer-events:none}
.freq input:checked + label{border-color:var(--gold);background:rgba(212,175,90,.06)}
.freq input:focus-visible + label{outline:2px solid var(--gold);outline-offset:2px}
.btn{background:var(--gold);color:var(--ink);border:0;padding:14px 20px;font:inherit;font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:13px;cursor:pointer;border-radius:2px;transition:background .2s}
.btn:hover{background:#e2c274}
.btn:disabled{opacity:.6;cursor:default}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--gold);color:var(--gold)}
.msg{font-size:15px;color:var(--gold);min-height:1.4em;margin:0}
@media (max-width:860px){.sub{grid-template-columns:1fr}}

/* footer */
footer{border-top:1px solid var(--line);padding:56px 0 48px}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:24px;align-items:end}
footer .mark{font-size:30px}
footer p{margin:6px 0 0;color:var(--muted);font-size:14px}
footer .socials a{padding:8px 12px}

/* ---------- admin ---------- */
.admin-fab{position:fixed;right:20px;bottom:20px;z-index:30;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);z-index:50;background:var(--panel);border-left:1px solid var(--gold-soft);display:flex;flex-direction:column;box-shadow:-20px 0 60px rgba(0,0,0,.5);font-size:15px}
.drawer-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.drawer-head h2{font-size:24px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;padding:12px 20px;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:1px solid var(--line);color:var(--muted);padding:6px 11px;border-radius:999px;font:inherit;font-size:13px;cursor:pointer}
.tabs button[aria-selected="true"]{border-color:var(--gold);color:var(--gold)}
.drawer-body{flex:1;overflow-y:auto;padding:20px;display:grid;gap:16px;align-content:start}
.drawer-foot{display:flex;gap:10px;align-items:center;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.drawer-foot .status{flex:1 1 100%;font-size:13.5px;color:var(--muted);margin:0}
.drawer-foot .status.err{color:var(--danger)}
.f{display:grid;gap:6px}
.f > span{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.f input[type=text],.f input[type=url],.f input[type=date],.f textarea,.f select{background:var(--ink);border:1px solid var(--line);color:var(--text);padding:10px 12px;font:inherit;font-size:15px;border-radius:2px;width:100%}
.f textarea{min-height:90px;resize:vertical;line-height:1.5}
.f textarea.tall{min-height:220px}
.f input:focus,.f textarea:focus,.f select:focus{border-color:var(--gold);outline:none}
.f.check{display:flex;align-items:center;gap:10px}
.f.check span{text-transform:none;letter-spacing:0;font-size:15px;color:var(--text)}
.hint{font-size:13px;color:var(--muted);margin:0}
.item{border:1px solid var(--line);padding:14px;display:grid;gap:12px;background:var(--ink)}
.item-head{display:flex;align-items:center;gap:6px}
.item-head strong{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon-btn{background:none;border:1px solid var(--line);color:var(--muted);width:32px;height:32px;border-radius:2px;cursor:pointer;font:inherit;font-size:14px;line-height:1}
.icon-btn:hover{border-color:var(--gold);color:var(--gold)}
.icon-btn.del:hover{border-color:var(--danger);color:var(--danger)}
.add{background:none;border:1px dashed var(--gold-soft);color:var(--gold);padding:12px;font:inherit;cursor:pointer;border-radius:2px}
.add:hover{border-style:solid}
.img-row{display:flex;gap:12px;align-items:center}
.img-row img{width:64px;height:80px;object-fit:cover;border:1px solid var(--line);background:var(--panel)}
.group-title{font-family:var(--display);font-size:20px;margin:8px 0 0;color:var(--gold)}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <a class="mark" href="#top" aria-label="Back to top">A·A·O</a>
    <nav aria-label="Main"><ul id="nav"></ul></nav>
  </div>
</header>

<main id="top"></main>

<footer>
  <div class="wrap">
    <div><a class="mark" href="#top">A·A·O</a><p id="foot-line"></p></div>
    <ul class="socials" id="foot-socials" aria-label="Social links"></ul>
  </div>
</footer>

<div class="reader" id="reader" hidden role="dialog" aria-modal="true" aria-labelledby="reader-title">
  <button class="btn ghost close" type="button" id="reader-close">Close</button>
  <article id="reader-body"></article>
</div>

<button class="btn admin-fab" type="button" id="admin-open" hidden>Edit site</button>

<aside class="drawer" id="drawer" hidden aria-label="Site editor">
  <div class="drawer-head"><h2>Edit site</h2><button class="btn ghost" type="button" id="admin-close">Close</button></div>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div class="drawer-body" id="drawer-body"></div>
  <div class="drawer-foot">
    <button class="btn" type="button" id="admin-save">Save &amp; publish</button>
    <button class="btn ghost" type="button" id="admin-discard">Discard changes</button>
    <p class="status" id="admin-status" role="status" aria-live="polite">Changes preview live. Nothing is public until you save.</p>
  </div>
</aside>

};
const PLATFORM_NAMES = {instagram:"Instagram", tiktok:"TikTok", x:"X", linkedin:"LinkedIn", youtube:"YouTube", facebook:"Facebook", threads:"Threads", website:"Website"};

function socialsHTML(withHandle){
  return S.socials.filter(s => s.url).map(s => {
    const name = PLATFORM_NAMES[s.platform] || "Link";
    return `<li><a href="${esc(safeUrl(s.url))}" rel="me noopener" target="_blank" aria-label="${esc(name)} ${esc(s.handle)}"><svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[s.platform] || ICONS.website}</svg>${esc(name)}${withHandle && s.handle ? ` <span class="h">${esc(s.handle)}</span>` : ""}</a></li>`;
  }).join("");
}

/* Words wrapped in *asterisks* show in gold. */
const gold = t => esc(t).replace(/\*([^*]+)\*/g, "<em>$1</em>");
const plain = t => String(t || "").replace(/\*/g, "");
function nameHTML(n){
  if (String(n).includes("*")) return gold(n);
  const parts = String(n || "").trim().split(/\s+/);
  if (parts.length < 2) return esc(n);
  const last = parts.pop();
  return `${esc(parts.join(" "))} <em>${esc(last)}</em>`;
}

/* replies state */
let db = null, userCap = null, me = null, isOwner = false, replyUI = false, REPLIES = {}, NAMES = {}, replyNote = "";

const paras = t => String(t || "").split(/\n\s*\n/).map(p => p.trim()).filter(Boolean).map(p => `<p>${esc(p).replace(/\n/g,"<br>")}</p>`).join("");

function render(){
  const P = S.profile, on = S.sections;
  const navItems = [["about","About",true],["building","Building",true],["gallery","Gallery",true],["thoughts","Thoughts",false],["journal","Journal",false],["subscribe","Subscribe",false]].filter(([k]) => on[k]);
  document.getElementById("nav").innerHTML = navItems.map(([k,l,opt]) => `<li${opt?' class="opt"':""}><a href="#${k}">${l}</a></li>`).join("");

  let h = `<section class="hero"><div class="wrap"><div>
    <p class="kicker">${esc(P.kicker)}</p><h1>${nameHTML(P.name)}</h1>
    <p class="lede">${esc(P.tagline)}</p>
    <ul class="socials" aria-label="Social links">${socialsHTML(true)}</ul></div>
    ${imgSrc(P.photo) ? `<figure class="portrait"><img src="${esc(imgSrc(P.photo))}" alt="${esc(P.photoAlt)}"></figure>` : ""}
  </div></section>`;

  if (on.about){ const A = S.about; h += `<section class="block" id="about"><div class="wrap">
    <div class="sec-head"><span class="label">About</span><h2>${esc(A.heading)}</h2></div>
    <div class="about${imgSrc(A.photo) ? "" : " solo indent"}">
      ${imgSrc(A.photo) ? `<figure class="cutout"><img src="${esc(imgSrc(A.photo))}" alt="${esc(A.photoAlt)}" loading="lazy"></figure>` : ""}
      <div>${A.lead ? `<p class="big">${esc(A.lead)}</p>` : ""}${A.paragraphs.filter(Boolean).map(p => `<p>${esc(p)}</p>`).join("")}
      ${A.facts.length ? `<dl class="facts">${A.facts.map(f => `<div><dt>${esc(f.label)}</dt><dd>${esc(f.value)}</dd></div>`).join("")}</dl>` : ""}</div>
    </div></div></section>`; }

  if (on.building){ const B = S.building; h += `<section class="block" id="building"><div class="wrap">
    <div class="sec-head"><span class="label">Building</span><h2>${esc(B.heading)}</h2></div>
    <div class="ventures">${B.items.map(v => v.featured
      ? `<article class="venture lead"><div><span class="st">${esc(v.status)}</span><h3>${gold(v.name)}</h3></div><div><p>${esc(v.description)}</p>${v.link ? `<div class="cta-row">${v.ctaText ? `<a class="btn" href="${esc(safeUrl(v.link))}" target="_blank" rel="noopener">${esc(v.ctaText)}</a>` : ""}<a href="${esc(safeUrl(v.link))}" target="_blank" rel="noopener">${esc(v.link.replace(/^https?:\/\//,""))} →</a></div>` : ""}</div></article>`
      : `<article class="venture"><span class="st">${esc(v.status)}</span><h3>${gold(v.name)}</h3><p>${esc(v.description)}</p>${v.link ? `<a href="${esc(safeUrl(v.link))}" target="_blank" rel="noopener">${esc(v.link.replace(/^https?:\/\//,""))} →</a>` : ""}</article>`).join("")}</div>
    </div></section>`; }

  if (on.interests){ const I = S.interests; h += `<section class="block" id="interests"><div class="wrap">
    <div class="sec-head"><span class="label">Interests</span><h2>${esc(I.heading)}</h2></div>
    <div class="interests">${I.items.map(i => `<div class="interest"><h3>${esc(i.title)}</h3><p>${esc(i.text)}</p></div>`).join("")}</div>
    </div></section>`; }

  if (on.gallery){ const G = S.gallery, pics = G.items.map((g,i) => [g,i]).filter(([g]) => imgSrc(g.src));
    h += `<section class="block" id="gallery"><div class="wrap">
    <div class="sec-head"><span class="label">Gallery</span><h2>${esc(G.heading)}</h2></div>
    ${pics.length ? `<div class="gallery">${pics.map(([g,i]) => `<figure><button type="button" class="ph" data-photo="${i}" aria-label="Open photo${g.caption ? ": " + esc(g.caption) : ""}"><img src="${esc(imgSrc(g.src))}" alt="${esc(g.caption)}" loading="lazy"></button>${g.caption ? `<figcaption>${esc(g.caption)}</figcaption>` : ""}</figure>`).join("")}</div>`
      : `<p class="hint indent">Photos coming soon.</p>`}
    </div></section>`; }

  if (on.thoughts){ const T = S.thoughts;
    const who = plain(S.profile.name).split(" ")[0];
    const handle = (S.socials.find(s => s.platform === "x") || S.socials[0] || {}).handle || "";
    const items = [...T.items].sort((a,b) => String(b.date).localeCompare(String(a.date)));
    h += `<section class="block" id="thoughts"><div class="wrap">
    <div class="sec-head"><span class="label">Thoughts</span><h2>${esc(T.heading)}</h2></div>
    <div class="feed indent">${items.map(t => `<article class="thought">
      <header>${imgSrc(S.profile.photo) ? `<img class="av" src="${esc(imgSrc(S.profile.photo))}" alt="">` : ""}<p><strong>${esc(who)}</strong> <span class="mut">${esc(handle)} · ${esc(fmtDate(t.date))}</span></p></header>
      <p class="tx">${esc(t.text).replace(/\n/g,"<br>")}</p>
      <div class="acts">${replyUI ? `<button class="lnk" type="button" data-reply-toggle="${esc(t.id)}">Reply</button>` : ""}${t.xUrl ? `<a href="${esc(safeUrl(t.xUrl))}" target="_blank" rel="noopener">Reply on X →</a>` : ""}<span class="mut" data-count="${esc(t.id)}"></span></div>
      <ul class="replies" data-replies="${esc(t.id)}"></ul>
      ${replyUI ? `<form class="reply-form" data-reply-form="${esc(t.id)}" hidden><label class="sr" for="r-${esc(t.id)}">Your reply</label><textarea id="r-${esc(t.id)}" maxlength="500" placeholder="Write a reply…" required></textarea><div class="row"><button class="btn sm" type="submit">Post reply</button><span class="rmsg mut" role="status"></span></div></form>` : ""}
    </article>`).join("") || `<p class="hint">Nothing here yet.</p>`}
    ${replyNote ? `<p class="hint">${esc(replyNote)}</p>` : ""}</div>
    </div></section>`; }

  if (on.quote && S.quote.text){ const Q = S.quote; h += `<section class="quote" aria-label="Quote"><div class="wrap">
    <div class="sec-head" style="margin-bottom:28px"><span class="label">${esc(Q.label)}</span><span></span></div>
    <div class="indent"><blockquote>${esc(Q.text)}</blockquote>${Q.by ? `<p class="by">${esc(Q.by)}</p>` : ""}</div>
    </div></section>`; }

  if (on.journal){ const J = S.journal; const visible = J.posts.map((p,i) => [p,i]).filter(([p]) => p.status !== "draft");
    h += `<section class="block" id="journal"><div class="wrap">
    <div class="sec-head"><span class="label">Journal</span><h2>${esc(J.heading)}</h2></div>
    <div class="posts">${visible.map(([p,i]) => {
      const meta = [p.status === "soon" ? "Coming soon" : fmtDate(p.date), p.category].filter(Boolean).join(" · ");
      return `<article class="post"><span class="meta">${esc(meta)}</span><h3>${esc(p.title)}</h3><p>${esc(p.excerpt)}</p>${p.status === "published" && p.body ? `<button class="read" type="button" data-read="${i}">Read post →</button>` : ""}</article>`;
    }).join("") || `<p class="hint">New posts are on the way.</p>`}</div>
    </div></section>`; }

  if (on.subscribe){ const U = S.subscribe; h += `<section class="block" id="subscribe"><div class="wrap sub">

function fmtDate(d){ if (!d) return ""; const t = new Date(d + "T12:00:00"); return isNaN(t) ? d : t.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}); }

/* journal reader */
const reader = document.getElementById("reader");
function openPost(i){
  const p = S.journal.posts[i]; if (!p) return;
  document.getElementById("reader-body").innerHTML = `<span class="meta">${esc([fmtDate(p.date), p.category].filter(Boolean).join(" · "))}</span><h2 id="reader-title">${esc(p.title)}</h2>${paras(p.body)}`;
  showReader(false);
}
function openPhoto(i){
  const g = S.gallery.items[i]; if (!g) return;
  document.getElementById("reader-body").innerHTML = `<figure class="lb"><img src="${esc(imgSrc(g.src))}" alt="${esc(g.caption)}">${g.caption ? `<figcaption id="reader-title">${esc(g.caption)}</figcaption>` : ""}</figure>`;
  showReader(true);
}
function showReader(wide){
  document.getElementById("reader-body").classList.toggle("wide", wide);
  reader.hidden = false; document.body.style.overflow = "hidden"; document.getElementById("reader-close").focus();
}

/* ---- replies ---- */
const timeAgo = iso => { const d = new Date(iso); if (isNaN(d)) return ""; const s = (Date.now() - d) / 1000;
  if (s < 60) return "just now"; if (s < 3600) return Math.floor(s/60) + "m"; if (s < 86400) return Math.floor(s/3600) + "h";
  return d.toLocaleDateString("en-US",{month:"short",day:"numeric"}); };

function renderReplies(){
  const all = [];
  for (const [uid, items] of Object.entries(REPLIES)) for (const r of (items || [])) all.push({...r, uid});
  all.sort((a,b) => String(a.at).localeCompare(String(b.at)));
  document.querySelectorAll("[data-replies]").forEach(ul => {
    const tid = ul.dataset.replies, list = all.filter(r => r.thought === tid);
    ul.innerHTML = list.map(r => `<li><p class="who"><strong>${esc(NAMES[r.uid] || "Someone")}</strong> <span class="mut">· ${esc(timeAgo(r.at))}</span>
      ${isOwner || r.uid === me ? `<button class="lnk del" type="button" data-del-reply="${esc(r.uid)}|${esc(r.id)}">Remove</button>` : ""}</p><p>${esc(r.text)}</p></li>`).join("");
    const c = document.querySelector(`[data-count="${CSS.escape(tid)}"]`);
    if (c) c.textContent = list.length ? `${list.length} ${list.length === 1 ? "reply" : "replies"}` : "";
  });
}

async function resolveNames(){
  if (!userCap?.profiles) return;
  const ids = Object.keys(REPLIES).filter(id => !(id in NAMES));
  if (!ids.length) return;
  try { const ps = await userCap.profiles(ids); for (const id of ids) NAMES[id] = ps?.[id]?.name || ""; renderReplies(); } catch {}
}

async function postReply(tid, text, form){
  const msg = form.querySelector(".rmsg"), btn = form.querySelector("button");
  btn.disabled = true; msg.textContent = "Posting…";
  try {
    const mine = [...(REPLIES[me] || [])];
    mine.push({id: "r" + Date.now().toString(36) + Math.random().toString(36).slice(2,6), thought: tid, text: text.slice(0,500), at: new Date().toISOString()});
    await db.doc("replies/" + me).set({items: mine});
    form.reset(); form.hidden = true; msg.textContent = "";
  } catch(err) {
    msg.textContent = err?.code === "invalid_argument" ? "You can't reply here with your current access." : "That didn't post. Please try again.";
  } finally { btn.disabled = false; }
}

async function deleteReply(uid, rid){
  try { await db.doc("replies/" + uid).set({items: (REPLIES[uid] || []).filter(r => r.id !== rid)}); }
  catch { alertStatus("Couldn't remove that reply."); }
}
function alertStatus(t){ replyNote = t; render(); setTimeout(() => { replyNote = ""; render(); }, 4000); }
function closePost(){ reader.hidden = true; document.body.style.overflow = ""; }
document.getElementById("reader-close").addEventListener("click", closePost);
document.addEventListener("keydown", e => { if (e.key === "Escape" && !reader.hidden) closePost(); });

/* page clicks + subscribe */
document.getElementById("top").addEventListener("click", e => {
  const b = e.target.closest("[data-read],[data-photo],[data-reply-toggle],[data-del-reply]"); if (!b) return;
  if (b.dataset.read) openPost(+b.dataset.read);
  if (b.dataset.photo) openPhoto(+b.dataset.photo);
  if (b.dataset.replyToggle) { const f = document.querySelector(`[data-reply-form="${CSS.escape(b.dataset.replyToggle)}"]`); if (f) { f.hidden = !f.hidden; if (!f.hidden) f.querySelector("textarea").focus(); } }
  if (b.dataset.delReply) {
    if (!b.dataset.confirm) { b.dataset.confirm = 1; b.textContent = "Click again to remove"; return; }
    const [uid, rid] = b.dataset.delReply.split("|"); deleteReply(uid, rid);
  }
});
document.getElementById("top").addEventListener("submit", e => {
  if (e.target.dataset.replyForm) {
    e.preventDefault();
    const text = e.target.querySelector("textarea").value.trim();
    if (text) postReply(e.target.dataset.replyForm, text, e.target);
    return;
  }
  if (e.target.id !== "signup") return;
  e.preventDefault();
  const email = document.getElementById("sub-email").value.trim();
  const msg = document.getElementById("sub-msg");
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { msg.textContent = "Please enter a valid email address."; document.getElementById("sub-email").focus(); return; }
  if (!S.subscribe.url) { msg.textContent = "Subscriptions open soon. Check back shortly!"; return; }
  const freq = document.querySelector("input[name=frequency]:checked").value;
  const name = document.getElementById("sub-name").value.trim();
  const btn = document.getElementById("sub-btn");
  btn.disabled = true; msg.textContent = "Signing you up…";
  fetch(S.subscribe.url, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({email, name, frequency:freq})})
    .then(r => { if (!r.ok) throw 0; msg.textContent = "You're in. Check your inbox to confirm."; e.target.reset(); })
    .catch(() => { msg.textContent = "That didn't go through. Please try again in a moment."; })
    .finally(() => { btn.disabled = false; });
});

render();

/* On the public site, the latest content lives in content/site.json (edited with Pages CMS). */
if (!window.claude) {
  fetch("content/site.json", {cache: "no-store"})
    .then(r => r.ok ? r.json() : null)
    .then(d => {
      if (!d || typeof d !== "object") return;
      const merged = {...SAVED};
      for (const k of Object.keys(d)) merged[k] = (d[k] && typeof d[k] === "object" && !Array.isArray(d[k])) ? {...SAVED[k], ...d[k]} : d[k];
      merged.sections = {...SAVED.sections, ...(d.sections || {})};
      SAVED = merged; S = structuredClone(merged); render();
    })
    .catch(() => {});
}

/* ---------------- admin ---------------- */
const drawer = document.getElementById("drawer"), body = document.getElementById("drawer-body"), statusEl = document.getElementById("admin-status");
let tab = "profile", assets = null;

const get = path => path.reduce((o,k) => o?.[k], S);
const set = (path, v) => { const last = path[path.length-1]; path.slice(0,-1).reduce((o,k) => o[k], S)[last] = v; };
const P = p => esc(JSON.stringify(p));

function setStatus(t, err){ statusEl.textContent = t; statusEl.classList.toggle("err", !!err); }
function markDirty(){ dirty = true; setStatus("Unsaved changes. Preview is live; click Save & publish to keep them."); }

const fText = (label, path, opts={}) => {
  const v = get(path) ?? "";
  if (opts.area) return `<label class="f"><span>${label}</span><textarea class="${opts.tall?"tall":""}" data-path="${P(path)}">${esc(v)}</textarea></label>`;
  return `<label class="f"><span>${label}</span><input type="${opts.type||"text"}" data-path="${P(path)}" value="${esc(v)}" placeholder="${esc(opts.ph||"")}"></label>`;
};
const fCheck = (label, path) => `<label class="f check"><input type="checkbox" data-path="${P(path)}" ${get(path)?"checked":""}><span>${label}</span></label>`;
const fSelect = (label, path, options) => `<label class="f"><span>${label}</span><select data-path="${P(path)}">${options.map(([v,l]) => `<option value="${esc(v)}" ${get(path)===v?"selected":""}>${esc(l)}</option>`).join("")}</select></label>`;
const fImage = (label, path) => `<div class="f"><span>${label}</span><div class="img-row">${imgSrc(get(path)) ? `<img src="${esc(imgSrc(get(path)))}" alt="">` : ""}<div style="display:grid;gap:6px;flex:1">
  ${assets ? `<input type="file" accept="image/*" data-upload="${P(path)}" aria-label="Upload new ${esc(label)}">` : `<p class="hint">Photo uploads aren't available in this view.</p>`}</div></div></div>`;

function list(path, itemTitle, fields, blank, addLabel){
  const arr = get(path);
  return arr.map((it,i) => `<div class="item"><div class="item-head"><strong>${esc(itemTitle(it) || "Untitled")}</strong>
    <button class="icon-btn" type="button" title="Move up" aria-label="Move up" data-op="up" data-list="${P(path)}" data-i="${i}">↑</button>
    <button class="icon-btn" type="button" title="Move down" aria-label="Move down" data-op="down" data-list="${P(path)}" data-i="${i}">↓</button>
    <button class="icon-btn del" type="button" title="Remove" aria-label="Remove" data-op="del" data-list="${P(path)}" data-i="${i}">✕</button></div>
    ${fields(i)}</div>`).join("") + `<button class="add" type="button" data-op="add" data-list="${P(path)}" data-blank="${P(blank)}">+ ${addLabel}</button>`;
}

const TABS = {
  profile: ["Profile", () => `
    ${fText("Name", ["profile","name"])}
    <p class="hint">Wrap a word in *asterisks* to make it gold, like Angela Agunwami *Onwuka*. This works in project names too.</p>
    ${fText("Small line above your name", ["profile","kicker"])}
    ${fText("Tagline", ["profile","tagline"], {area:true})}
    ${fImage("Main photo", ["profile","photo"])}
    ${fText("Photo description (for screen readers)", ["profile","photoAlt"])}`],
  socials: ["Socials", () => list(["socials"], s => `${PLATFORM_NAMES[s.platform]||"Link"} ${s.handle||""}`, i => `
    ${fSelect("Platform", ["socials",i,"platform"], Object.entries(PLATFORM_NAMES))}
    ${fText("Handle", ["socials",i,"handle"], {ph:"@agunwamiii"})}
    ${fText("Link", ["socials",i,"url"], {type:"url", ph:"https://"})}`, {platform:"instagram",handle:"",url:""}, "Add social link")],
  about: ["About", () => `
    ${fText("Heading", ["about","heading"])}
    ${fImage("About photo", ["about","photo"])}
    ${fText("Photo description", ["about","photoAlt"])}
    ${fText("Opening line (large text)", ["about","lead"], {area:true})}
    <h3 class="group-title">Paragraphs</h3>
    ${list(["about","paragraphs"], p => p.slice(0,40), i => fText("Text", ["about","paragraphs",i], {area:true}), "", "Add paragraph")}
    <h3 class="group-title">Quick facts</h3>
    ${list(["about","facts"], f => f.label, i => fText("Label", ["about","facts",i,"label"]) + fText("Value", ["about","facts",i,"value"]), {label:"",value:""}, "Add fact")}`],
  building: ["Building", () => `
    ${fText("Heading", ["building","heading"])}
    ${list(["building","items"], v => v.name, i => `
      ${fText("Name", ["building","items",i,"name"])}
      ${fText("Status line", ["building","items",i,"status"], {ph:"In development"})}
      ${fText("Description", ["building","items",i,"description"], {area:true})}
      ${fText("Link (optional)", ["building","items",i,"link"], {type:"url"})}
      ${fCheck("Feature this one (full-width card)", ["building","items",i,"featured"])}
      ${get(["building","items",i,"featured"]) ? fText("Button text (optional)", ["building","items",i,"ctaText"], {ph:"Start a project"}) : ""}`, {name:"",status:"",description:"",link:"",ctaText:"",featured:false}, "Add project")}`],
  gallery: ["Gallery", () => `
    ${fText("Heading", ["gallery","heading"])}
    ${assets ? "" : `<p class="hint">Photo uploads need the editor opened from claude.ai.</p>`}
    ${list(["gallery","items"], g => g.caption || "Photo", i => fImage("Photo", ["gallery","items",i,"src"]) + fText("Caption (optional)", ["gallery","items",i,"caption"]), {src:"",caption:""}, "Add photo")}`],
  thoughts: ["Thoughts", () => `
    ${fText("Heading", ["thoughts","heading"])}
    <p class="hint">Short posts, like tweets. Newest shows first. Paste the link to the same post on X to add a "Reply on X" button.</p>
    ${list(["thoughts","items"], t => (t.text || "").slice(0,40), i => `
      ${fText("Post", ["thoughts","items",i,"text"], {area:true})}
      ${fText("Date", ["thoughts","items",i,"date"], {type:"date"})}
      ${fText("Link to this post on X (optional)", ["thoughts","items",i,"xUrl"], {type:"url", ph:"https://x.com/agunwamiii/status/…"})}`,
      {id:"",text:"",date:new Date().toISOString().slice(0,10),xUrl:""}, "Add thought")}`],
  interests: ["Interests", () => `
    ${fText("Heading", ["interests","heading"])}
    ${list(["interests","items"], x => x.title, i => fText("Title", ["interests","items",i,"title"]) + fText("Text", ["interests","items",i,"text"], {area:true}), {title:"",text:""}, "Add interest")}`],
  quote: ["Quote", () => `
    ${fText("Label", ["quote","label"], {ph:"This week"})}
    ${fText("Quote", ["quote","text"], {area:true})}
    ${fText("Signed", ["quote","by"], {ph:"Angela"})}`],
  journal: ["Journal", () => `
    ${fText("Heading", ["journal","heading"])}
    <p class="hint">Published posts show a "Read post" link. Coming soon posts show as teasers. Drafts are hidden.</p>
    ${list(["journal","posts"], p => `${p.title} (${({published:"published",soon:"coming soon",draft:"draft"})[p.status]||p.status})`, i => `
      ${fText("Title", ["journal","posts",i,"title"])}
      ${fSelect("Status", ["journal","posts",i,"status"], [["published","Published"],["soon","Coming soon"],["draft","Draft (hidden)"]])}
      ${fSelect("Category", ["journal","posts",i,"category"], [["Life","Life"],["Building","Building"],["Tech","Tech"]])}
      ${fText("Date", ["journal","posts",i,"date"], {type:"date"})}
      ${fText("Short summary", ["journal","posts",i,"excerpt"], {area:true})}
      ${fText("Full post (leave a blank line between paragraphs)", ["journal","posts",i,"body"], {area:true, tall:true})}`,
      {title:"New post",category:"Life",date:new Date().toISOString().slice(0,10),status:"draft",excerpt:"",body:""}, "Add post")}`],
  subscribe: ["Subscribe", () => `
    ${fText("Heading", ["subscribe","heading"])}
    ${fText("Text", ["subscribe","text"], {area:true})}
    ${fText("Daily option note", ["subscribe","dailyNote"])}
    ${fText("Weekly option note", ["subscribe","weeklyNote"])}
    ${fText("Newsletter signup URL", ["subscribe","url"], {type:"url", ph:"From Beehiiv, Kit, Buttondown…"})}
    <p class="hint">Leave empty until your newsletter service is set up. Visitors will see "Subscriptions open soon."</p>`],
  sections: ["Show / hide", () => `<p class="hint">Turn whole sections on or off.</p>
    ${[["about","About"],["building","Building"],["interests","Interests"],["gallery","Gallery"],["thoughts","Thoughts"],["quote","Quote"],["journal","Journal"],["subscribe","Subscribe"]].map(([k,l]) => fCheck(l, ["sections",k])).join("")}`]
};

function drawTabs(){
  document.getElementById("tabs").innerHTML = Object.entries(TABS).map(([k,[l]]) => `<button type="button" role="tab" aria-selected="${k===tab}" data-tab="${k}">${l}</button>`).join("");
  body.innerHTML = TABS[tab][1]();
}

document.getElementById("tabs").addEventListener("click", e => { const b = e.target.closest("[data-tab]"); if (b){ tab = b.dataset.tab; drawTabs(); body.scrollTop = 0; } });

body.addEventListener("input", e => {
  const el = e.target; if (!el.dataset.path) return;
  set(JSON.parse(el.dataset.path), el.type === "checkbox" ? el.checked : el.value);
  markDirty(); render();
});
body.addEventListener("change", e => {
  const el = e.target;
  if (el.tagName === "SELECT" || el.type === "checkbox") drawTabs();
  if (el.dataset.upload && el.files[0]) upload(JSON.parse(el.dataset.upload), el.files[0]);
});
body.addEventListener("click", e => {
  const b = e.target.closest("[data-op]"); if (!b) return;
  const arr = get(JSON.parse(b.dataset.list)), i = +b.dataset.i;
  if (b.dataset.op === "add") { const it = structuredClone(JSON.parse(b.dataset.blank)); if (it && typeof it === "object" && "id" in it && !it.id) it.id = "t" + Date.now().toString(36); arr.push(it); }
  if (b.dataset.op === "del") { const label = b.closest(".item").querySelector("strong").textContent; if (!b.dataset.confirm) { b.dataset.confirm = 1; b.textContent = "?"; b.title = "Click again to remove"; setStatus(`Click ✕ again to remove "${label}".`); return; } arr.splice(i,1); }
  if (b.dataset.op === "up" && i > 0) [arr[i-1],arr[i]] = [arr[i],arr[i-1]];
  if (b.dataset.op === "down" && i < arr.length-1) [arr[i+1],arr[i]] = [arr[i],arr[i+1]];
  markDirty(); render(); drawTabs();
});

async function upload(path, file){
  if (!assets) return;
  setStatus("Uploading photo…");
  try { const r = await assets.upload(file); set(path, r.url); markDirty(); render(); drawTabs(); setStatus("Photo uploaded. Click Save & publish to keep it."); }
  catch(err){ setStatus("That photo didn't upload. Try a JPG or PNG under 20 MB.", true); }
}

document.getElementById("admin-open").addEventListener("click", () => { drawer.hidden = false; drawTabs(); });
document.getElementById("admin-close").addEventListener("click", () => { drawer.hidden = true; });
document.getElementById("admin-discard").addEventListener("click", () => { S = structuredClone(SAVED); dirty = false; render(); drawTabs(); setStatus("Changes discarded."); });

document.getElementById("admin-save").addEventListener("click", async () => {
  const btn = document.getElementById("admin-save");
  const art = await claude.use("artifact");
  if (!art) { setStatus("Saving isn't available in this view. Open the site from claude.ai to save.", true); return; }
  btn.disabled = true; setStatus("Publishing…");
  try {
    let src = "";
    for (const u of ["index.html", location.pathname]) {
      try { const r = await fetch(u, {cache:"no-store"}); if (r.ok) { const t = await r.text(); if (t.includes('id="site-data"')) { src = t; break; } } } catch {}
    }
    if (!src) throw new Error("source");
    const json = JSON.stringify(S, null, 1).replace(/</g, "\\u003c");
    const out = src.replace(/(<script type="application\/json" id="site-data">)[\s\S]*?(<\/script>)/, (m,a,b) => a + "\n" + json + "\n" + b);
    await art.publish(out);
    dirty = false; setStatus("Published. The page will refresh with your changes.");
  } catch(err) {
    const code = String(err?.code || err?.message || err);
    if (/conflict/i.test(code)) setStatus("Someone saved a newer version at the same time, so the page reloaded with theirs. Make your edit again.", true);
    else if (/not_granted|not_writer/i.test(code)) setStatus("You don't have permission to edit this site.", true);
    else setStatus("Couldn't publish. Please try again.", true);
  } finally { btn.disabled = false; }
});

window.addEventListener("beforeunload", e => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });

/* Show the editor only to people who can edit this page, and turn on replies for signed-in viewers. */
(async () => {
  try {
    if (!window.claude?.use) return;
    const [user, dbx] = await Promise.all([claude.use("user"), claude.use("db")]);
    userCap = user;
    if (user) {
      isOwner = !!(await user.isOwner());
      try { me = await user.id(); } catch {}
      if (await user.canEdit()) {
        assets = await claude.use("assets");
        document.getElementById("admin-open").hidden = false;
      }
    }
    if (dbx) {
      db = dbx;
      if (me) { replyUI = true; render(); }
      const timer = setTimeout(() => { if (!Object.keys(REPLIES).length) { replyNote = "Replies can't be loaded right now."; render(); } }, 10000);
      db.collection("replies").onSnapshot(snap => {
        if (!snap.metadata.fromCache) { clearTimeout(timer); if (replyNote) { replyNote = ""; render(); } }
        REPLIES = {}; snap.docs.forEach(d => { if (d.exists) REPLIES[d.id] = d.data().items || []; });
        renderReplies(); resolveNames();
      }, () => { clearTimeout(timer); });
    }
  } catch {}
})();
})();
</script>
